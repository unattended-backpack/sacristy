# Traefik dynamic configuration.
http:
  routers:
{{ if .BlockscoutHost }}
    blockscout:
      rule: "Host(`blockscout.l2.sacristy.local`)"
      service: blockscout
      entryPoints:
        - web
{{ end }}
{{ if .BlockscoutApiHost }}
    blockscout-api:
      rule: "Host(`api.blockscout.l2.sacristy.local`)"
      service: blockscout-api
      entryPoints:
        - web
{{ end }}
    rpc:
      rule: "Host(`rpc.l2.sacristy.local`)"
      service: rpc
      entryPoints:
        - web

  services:
{{ if .BlockscoutHost }}
    blockscout:
      loadBalancer:
        servers:
          - url: "http://{{ .BlockscoutHost }}:{{ .BlockscoutPort }}"
{{ end }}
{{ if .BlockscoutApiHost }}
    blockscout-api:
      loadBalancer:
        servers:
          - url: "http://{{ .BlockscoutApiHost }}:{{ .BlockscoutApiPort }}"
{{ end }}
    rpc:
      loadBalancer:
        servers:
          - url: "http://{{ .RpcHost }}:{{ .RpcPort }}"
